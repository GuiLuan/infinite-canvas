services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

  eagle-agent:
    extends:
      file: ./eagle-agent/docker-compose.yml
      service: eagle-agent
    build:
      context: ./eagle-agent
    profiles: [eagle]

  proxy:
    image: infinite-canvas-proxy:local
    build:
      context: ./canvas-proxy
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:23210:23210"
    restart: unless-stopped
